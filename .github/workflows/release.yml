name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/build_release.py --out dist
      - name: Publish release with one zip per edition
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
